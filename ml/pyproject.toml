[project]
name = "dp-ml"
version = "0.1.0"
description = "Training, evaluation and ONNX export for the Dark Pattern Analyzer"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# NOTE: this dependency set is deliberately separate from backend/.
# Training needs torch + transformers (~2.5 GB). Serving needs only
# onnxruntime + tokenizers (~120 MB). Keeping them apart keeps the deployed
# image small. The backend never imports from this package.
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "datasets>=2.21",
    "accelerate>=0.34",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "optimum[onnxruntime]>=1.22",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
