[project]
name = "dp-backend"
version = "0.1.0"
description = "FastAPI inference service for the Dark Pattern Analyzer (Stage 2)"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# NOTE: deliberately separate from ml/. Training needs torch + transformers
# (~2.5 GB). Serving needs onnxruntime + tokenizers (~120 MB). The backend
# never imports from ml/ -- the only interface is the artifact bundle in
# ml/artifacts/model_v1/.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "onnxruntime>=1.19",
    "tokenizers>=0.19",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
